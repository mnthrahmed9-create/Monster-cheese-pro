
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monster Chess 3D</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

:root{
 --gold:#ffd477;
 --gold2:#a96d20;
 --bg:#080d18;
 --panel:#17243a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;
 background:
 radial-gradient(ellipse at 50% 5%,#35486a 0%,transparent 48%),
 linear-gradient(180deg,#111b2d,#080d18 75%);
 color:#fff;
 font-family:Cairo,sans-serif;
 min-height:100vh;
 overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer}
.app{max-width:500px;margin:auto;padding-bottom:95px}

/* HEADER */
.header{
 display:flex;justify-content:space-between;align-items:center;
 padding:13px 15px;
 background:#09111feF;
 border-bottom:1px solid #d5a64b44;
 box-shadow:0 7px 25px #0008;
 position:relative;z-index:5;
}
.user{display:flex;align-items:center;gap:10px}
.avatar{
 width:48px;height:48px;border-radius:16px;
 background:linear-gradient(145deg,#ffdf91,#8c4c1d);
 display:grid;place-items:center;font-size:29px;
 border:2px solid var(--gold);
 box-shadow:inset 0 3px 8px #fff8,0 6px 15px #0009;
}
.name{font-size:13px;font-weight:900}
.level{font-size:10px;color:var(--gold)}
.money{display:flex;gap:6px}
.money div{
 background:linear-gradient(145deg,#263752,#101a2c);
 border:1px solid #ffffff22;
 border-radius:12px;padding:6px 9px;
 font-size:12px;box-shadow:0 4px 0 #050a12;
}

/* HERO 3D */
.hero{
 margin:18px 13px 22px;
 height:315px;
 border-radius:25px;
 position:relative;
 overflow:hidden;
 border:1px solid #e9bd65;
 background:
 radial-gradient(circle at 50% 45%,#75502d 0%,transparent 37%),
 radial-gradient(circle at 80% 20%,#344d70,transparent 50%),
 linear-gradient(145deg,#26364d,#0a1220 75%);
 box-shadow:0 15px 0 #080d16,0 22px 35px #0009,
 inset 0 2px 8px #fff3;
 perspective:800px;
}
.hero:before{
 content:"";
 position:absolute;
 width:260px;height:260px;
 border:1px solid #ffd47744;border-radius:50%;
 top:25px;left:calc(50% - 130px);
 box-shadow:0 0 0 18px #ffd4770b,
 0 0 0 38px #ffd47709,0 0 40px #d69b3b44;
}
.hero:after{
 content:"";
 position:absolute;
 bottom:-40px;left:8%;width:84%;height:90px;
 background:#0009;filter:blur(22px);
 border-radius:50%;
}
.hero-title{
 position:absolute;top:16px;right:18px;z-index:3;
}
.hero-title small{
 color:var(--gold);font-weight:900;
 letter-spacing:3px;font-size:10px;
}
.hero-title h1{
 font-size:25px;line-height:1.4;
 margin:5px 0;font-weight:900;
 text-shadow:0 3px 10px #000;
}
.hero-title p{font-size:10px;color:#d3d9e3;margin:0}
.monster{
 position:absolute;
 z-index:2;
 left:50%;top:58px;
 transform:translateX(-50%);
 font-size:128px;
 filter:drop-shadow(0 15px 10px #000)
 drop-shadow(0 0 20px #ffbd4a55);
 animation:monsterFloat 4s ease-in-out infinite;
}
@keyframes monsterFloat{
 0%,100%{transform:translate(-50%,0) rotate(-4deg)}
 50%{transform:translate(-50%,-13px) rotate(4deg)}
}
.chess-platform{
 position:absolute;bottom:22px;left:50%;
 transform:translateX(-50%) rotateX(55deg);
 width:205px;height:100px;
 display:grid;grid-template-columns:repeat(4,1fr);
 border:4px solid #d9a64c;
 box-shadow:0 14px 0 #68451e,0 23px 20px #000;
}
.chess-platform span:nth-child(odd){background:#e8c47f}
.chess-platform span:nth-child(even){background:#49331e}
.chess-platform span:nth-child(5),
.chess-platform span:nth-child(7){background:#49331e}
.chess-platform span:nth-child(6),
.chess-platform span:nth-child(8){background:#e8c47f}

.play{
 position:absolute;bottom:17px;right:50%;
 transform:translateX(50%);
 z-index:4;
 width:190px;padding:12px;
 border:1px solid #fff1b0;
 border-radius:15px;
 background:linear-gradient(180deg,#ffe7a0,#d69b39 60%,#99601d);
 color:#271707;font-size:16px;font-weight:900;
 box-shadow:0 6px 0 #684318,0 12px 20px #0009,
 inset 0 2px 4px #fff;
}
.play:active{transform:translate(50%,4px);box-shadow:0 2px 0 #684318}

/* TITLES */
.section{padding:0 14px;margin-top:25px}
.section-head{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:13px;
}
.section-head h2{font-size:16px;margin:0;font-weight:900}
.section-head h2 span{color:var(--gold)}
.section-head small{font-size:10px;color:#aab6c9}

/* 3D MODE CARDS */
.modes{
 display:grid;grid-template-columns:1fr 1fr;gap:13px;
 perspective:700px;
}
.mode{
 min-height:140px;
 border-radius:19px;
 padding:13px;
 position:relative;
 overflow:hidden;
 background:linear-gradient(145deg,#293c59,#111c30);
 border:1px solid #ffffff28;
 box-shadow:0 7px 0 #080e19,0 13px 18px #0008,
 inset 0 2px 5px #ffffff19;
 transition:.2s;
}
.mode:active{transform:translateY(5px) rotateX(4deg);box-shadow:0 2px 0 #080e19}
.mode:before{
 content:"";position:absolute;width:100px;height:100px;
 background:#ffffff09;border-radius:50%;
 left:-25px;top:-35px;
}
.mode-icon{
 font-size:43px;
 filter:drop-shadow(0 6px 5px #0008);
 display:block;
}
.mode h3{font-size:13px;margin:5px 0 0}
.mode p{font-size:10px;color:#aebbd0;margin:2px 0}
.mode-tag{
 position:absolute;top:12px;left:10px;
 font-size:9px;color:var(--gold);
 background:#0005;border-radius:8px;padding:4px 7px;
}
.mode:nth-child(2){background:linear-gradient(145deg,#4b3527,#172034)}
.mode:nth-child(3){background:linear-gradient(145deg,#344b42,#14251f)}
.mode:nth-child(4){background:linear-gradient(145deg,#42365a,#17182e)}

/* EVENT CARDS */
.event{
 display:flex;align-items:center;gap:12px;
 padding:12px;margin-bottom:12px;
 border-radius:17px;
 background:linear-gradient(145deg,#263650,#111b2c);
 border:1px solid #ffffff1c;
 box-shadow:0 5px 0 #080d17,0 9px 14px #0007;
}
.event-icon{
 width:52px;height:52px;flex-shrink:0;
 display:grid;place-items:center;font-size:28px;
 border-radius:15px;
 background:linear-gradient(145deg,#ffd77e,#82501d);
 box-shadow:inset 0 3px 5px #fff8,0 5px 9px #0008;
}
.event-info{flex:1}
.event-info b{font-size:12px}
.event-info p{font-size:10px;color:#aab6c9;margin:2px 0}
.event button{
 border:1px solid #dcb35f;
 color:var(--gold);background:#dcb35f16;
 border-radius:10px;padding:7px 10px;font-size:10px;
}

/* FOOTER */
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 max-width:500px;margin:auto;height:75px;
 background:#0b1423f5;
 border-top:1px solid #d7ae5b44;
 display:grid;grid-template-columns:repeat(4,1fr);
 z-index:10;
 backdrop-filter:blur(15px);
 padding-bottom:env(safe-area-inset-bottom);
}
.nav{
 background:none;border:0;color:#8997ad;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 gap:3px;font-size:10px;
}
.nav span{font-size:23px}
.nav.active{color:var(--gold);text-shadow:0 0 12px #e9bd65}

/* POPUP */
.overlay{
 display:none;position:fixed;inset:0;
 background:#000c;z-index:50;
 align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex}
.popup{
 width:100%;max-width:360px;text-align:center;
 border:1px solid var(--gold);
 border-radius:22px;padding:23px;
 background:linear-gradient(145deg,#273954,#0b1423);
 box-shadow:0 20px 60px #000;
}
.popup-icon{font-size:48px}
.popup h2{font-size:19px}
.popup p{font-size:12px;color:#c0cada;line-height:1.9}
.close{
 padding:9px 28px;border:0;border-radius:10px;
 background:linear-gradient(145deg,#ffdf91,#c28b34);
 color:#251707;font-weight:900;
}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="user">
  <div class="avatar">👹</div>
  <div>
   <div class="name">محارب الوحوش</div>
   <div class="level">⭐ المستوى 1</div>
  </div>
 </div>
 <div class="money">
  <div>🪙 <b id="coins">1000</b></div>
  <div>💎 <b id="gems">10</b></div>
 </div>
</header>

<section class="hero">
 <div class="hero-title">
  <small>MONSTER CHESS</small>
  <h1>شطرنج الوحوش<br>3D</h1>
  <p>اصنع أسطورتك واهزم أعداءك!</p>
 </div>

 <div class="monster">🐉</div>

 <div class="chess-platform">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
 </div>

 <button class="play" onclick="startGame()">⚔️ ابدأ المعركة</button>
</section>

<section class="section">
 <div class="section-head">
  <h2>🎮 <span>أنماط اللعب</span></h2>
  <small>اختر معركتك</small>
 </div>

 <div class="modes">
  <button class="mode" onclick="startGame()">
   <span class="mode-tag">POPULAR</span>
   <span class="mode-icon">🤖</span>
   <h3>اللعب ضد الكمبيوتر</h3>
   <p>تحدى الذكاء الاصطناعي</p>
  </button>

  <button class="mode" onclick="showPopup('🌐','اللعب أونلاين','سيتم تفعيل اللعب مع الأصدقاء عبر الإنترنت في التحديث القادم.')">
   <span class="mode-tag">ONLINE</span>
   <span class="mode-icon">⚔️</span>
   <h3>اللعب أونلاين</h3>
   <p>واجه لاعبين من العالم</p>
  </button>

  <button class="mode" onclick="showPopup('👥','اللعب مع صديق','سيتم إضافة غرف اللعب الخاصة قريباً.')">
   <span class="mode-tag">FRIENDS</span>
   <span class="mode-icon">🛡️</span>
   <h3>العب مع صديق</h3>
   <p>أنشئ معركة خاصة</p>
  </button>

  <button class="mode" onclick="showPopup('🏆','البطولات','استعد للبطولات والتحديات القادمة.')">
   <span class="mode-tag">EVENT</span>
   <span class="mode-icon">👑</span>
   <h3>البطولات</h3>
   <p>نافس على لقب الملك</p>
  </button>
 </div>
</section>

<section class="section">
 <div class="section-head">
  <h2>🏅 <span>المهام والمكافآت</span></h2>
  <small>احصل على الجوائز</small>
 </div>

 <div class="event">
  <div class="event-icon">🎁</div>
  <div class="event-info">
   <b>الهدية اليومية</b>
   <p>احصل على 100 قطعة ذهبية</p>
  </div>
  <button onclick="dailyGift()">استلام</button>
 </div>

 <div class="event">
  <div class="event-icon">🔥</div>
  <div class="event-info">
   <b>تحدي المحارب</b>
   <p>العب مباراة وارفع مستواك</p>
  </div>
  <button onclick="startGame()">العب الآن</button>
 </div>
</section>

<section class="section">
 <div class="section-head">
  <h2>✨ <span>المزيد</span></h2>
 </div>
 <div class="modes">
  <button class="mode" onclick="showPopup('🛒','المتجر','هنا سنضيف متجر الوحوش والأسلحة والأشكال.')">
   <span class="mode-icon">🛒</span>
   <h3>المتجر</h3><p>اكتشف المظاهر الجديدة</p>
  </button>
  <button class="mode" onclick="showPopup('⚙️','الإعدادات','إعدادات الصوت واللغة والتحكم ستضاف هنا.')">
   <span class="mode-icon">⚙️</span>
   <h3>الإعدادات</h3><p>خصص تجربتك</p>
  </button>
 </div>
</section>

</div>

<nav class="bottom">
 <button class="nav active" onclick="setTab(this,'الرئيسية')">
  <span>🏠</span>الرئيسية
 </button>
 <button class="nav" onclick="showPopup('🏆','الترتيب','قائمة أفضل اللاعبين ستضاف لاحقاً.')">
  <span>🏆</span>الترتيب
 </button>
 <button class="nav" onclick="showPopup('🛒','المتجر','متجر الوحوش قادم قريباً.')">
  <span>🛒</span>المتجر
 </button>
 <button class="nav" onclick="showPopup('👤','حسابي','ملف اللاعب الشخصي.')">
  <span>👤</span>حسابي
 </button>
</nav>

<div class="overlay" id="overlay">
 <div class="popup">
  <div class="popup-icon" id="popIcon">👑</div>
  <h2 id="popTitle">العنوان</h2>
  <p id="popText"></p>
  <button class="close" onclick="closePopup()">حسناً</button>
 </div>
</div>

<script>
let coins=Number(localStorage.getItem("monster_coins")||1000);
let gifted=localStorage.getItem("monster_daily_gift");
document.getElementById("coins").textContent=coins;

function startGame(){
 window.location.href="game.html";
}

function showPopup(icon,title,message){
 document.getElementById("popIcon").textContent=icon;
 document.getElementById("popTitle").textContent=title;
 document.getElementById("popText").textContent=message;
 document.getElementById("overlay").classList.add("show");
}
function closePopup(){
 document.getElementById("overlay").classList.remove("show");
}
function dailyGift(){
 if(gifted){
  showPopup("🎁","استلمت هديتك","لقد استلمت هديتك اليومية سابقاً.");
  return;
 }
 coins+=100;
 gifted="yes";
 localStorage.setItem("monster_coins",coins);
 localStorage.setItem("monster_daily_gift","yes");
 document.getElementById("coins").textContent=coins;
 showPopup("🎉","مبروك!","حصلت على 100 قطعة ذهبية.");
}
function setTab(button,name){
 document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));
 button.classList.add("active");
 if(name!=="الرئيسية")showPopup("👑",name,"هذه الصفحة سنطورها في المراحل القادمة.");
}
</script>
</body>
</html>
