<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شطرنج الوحوش 3D - القائمة الرئيسية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* لمنع وميض الشاشة عند اللمس */
        }

        body {
            background-color: #000;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* الحاوية الرئيسية للصورة */
        #ui-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* ⚠️ تأكد أن اسم الصورة هنا يطابق اسم الصورة المرفوعة على GitHub */
            background-image: url('menu.jpg'); 
            
            background-size: 100% 100%; /* تمدد الصورة لتملأ الشاشة بالكامل */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================================
           الأزرار الشفافة
           ========================================= */
        .hotspot {
            position: absolute;
            background: transparent; /* شفافة */
            border: none;
            cursor: pointer;
            border-radius: 12px;
            z-index: 10;
            transition: background 0.1s;
        }

        /* تأثير وميض خفيف جداً عند الضغط ليعرف المستخدم أنه ضغط على الزر */
        .hotspot:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* =========================================
           إحداثيات الأزرار (مضبوطة على الصورة الجديدة)
           ========================================= */
        
        /* --- الشريط العلوي --- */
        .btn-profile { top: 2%; left: 2%; width: 35%; height: 7.5%; } 
        .btn-gold-plus { top: 2.5%; left: 55%; width: 5%; height: 3.5%; border-radius: 50%; } 
        .btn-gem-plus { top: 2.5%; left: 76%; width: 5%; height: 3.5%; border-radius: 50%; } 
        .btn-settings { top: 2%; left: 84%; width: 6.5%; height: 4%; border-radius: 50%; } 
        .btn-mail { top: 2%; right: 2%; width: 7.5%; height: 4%; border-radius: 10px; } 

        /* --- القائمة اليسرى --- */
        .btn-quests { top: 33.5%; left: 2%; width: 18%; height: 6.5%; } 
        .btn-achievements { top: 41%; left: 2%; width: 18%; height: 6.5%; } 
        .btn-rewards { top: 48.5%; left: 2%; width: 18%; height: 6.5%; } 
        .btn-ranks { top: 56%; left: 2%; width: 18%; height: 6.5%; } 

        /* --- صندوق المكافآت اليومية (اليمين) --- */
        .btn-daily-chest { top: 33.5%; right: 2%; width: 28%; height: 20%; } 
        .btn-streak { top: 54.5%; right: 2%; width: 28%; height: 5%; } 

        /* --- الزر الرئيسي الكبير (ابدأ المواجهة) --- */
        .btn-start { bottom: 26%; left: 20%; width: 60%; height: 8%; } 

        /* --- الأزرار الثلاثة السفلية --- */
        .btn-online { bottom: 13%; left: 2.5%; width: 29%; height: 8%; } 
        .btn-ai { bottom: 13%; left: 35.5%; width: 29%; height: 8%; } 
        .btn-challenges { bottom: 13%; right: 2.5%; width: 29%; height: 8%; } 

        /* --- شريط التنقل السفلي --- */
        .nav-store { bottom: 0; left: 0; width: 25%; height: 9%; } 
        .nav-inventory { bottom: 0; left: 25%; width: 25%; height: 9%; } 
        .nav-account { bottom: 0; left: 50%; width: 25%; height: 9%; } 
        .nav-home { bottom: 0; left: 75%; width: 25%; height: 9%; } 

    </style>
</head>
<body>

    <div id="ui-container">
        
        <!-- الشريط العلوي -->
        <div class="hotspot btn-profile" onclick="alert('الملف الشخصي')"></div>
        <div class="hotspot btn-gold-plus" onclick="alert('شراء ذهب')"></div>
        <div class="hotspot btn-gem-plus" onclick="alert('شراء جواهر')"></div>
        <div class="hotspot btn-settings" onclick="alert('الإعدادات')"></div>
        <div class="hotspot btn-mail" onclick="alert('الرسائل')"></div>

        <!-- القائمة اليسرى -->
        <div class="hotspot btn-quests" onclick="alert('المهام اليومية')"></div>
        <div class="hotspot btn-achievements" onclick="alert('الإنجازات')"></div>
        <div class="hotspot btn-rewards" onclick="alert('مكافآت خاصة')"></div>
        <div class="hotspot btn-ranks" onclick="alert('رتب والألقاب')"></div>

        <!-- صندوق المكافآت -->
        <div class="hotspot btn-daily-chest" onclick="alert('افتح صندوق المكافآت!')"></div>
        <div class="hotspot btn-streak" onclick="alert('سلسلة المكافآت')"></div>

        <!-- 🟢 الأزرار اللي تنقل للعبة (مربوطة بملف game.html) -->
        <div class="hotspot btn-start" onclick="window.location.href='game.html'"></div>
        <div class="hotspot btn-ai" onclick="window.location.href='game.html'"></div>

        <!-- الأزرار السفلية الباقية -->
        <div class="hotspot btn-online" onclick="alert('اللعب أونلاين (قريباً)')"></div>
        <div class="hotspot btn-challenges" onclick="alert('التحديات الكبرى (قريباً)')"></div>

        <!-- شريط التنقل السفلي -->
        <div class="hotspot nav-store" onclick="alert('المتجر')"></div>
        <div class="hotspot nav-inventory" onclick="alert('المخزون')"></div>
        <div class="hotspot nav-account" onclick="alert('حسابي')"></div>
        <div class="hotspot nav-home" onclick="alert('أنت في الرئيسية')"></div>

    </div>

</body>
</html>
