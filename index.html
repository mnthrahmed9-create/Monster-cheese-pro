<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Modern Jungle Chess 3D</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #000; overflow: hidden; font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; text-align: center; }

/* واجهة اللعبة (Ludo King Style) */
#main-menu {
    position: fixed; inset: 0; z-index: 1000;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
}
#main-menu::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 40%);
    pointer-events: none;
}
.menu-title {
    font-size: 42px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 0 #ff9800, 0 8px 15px rgba(0,0,0,0.5);
    margin-bottom: 10px; letter-spacing: 2px; animation: float 3s ease-in-out infinite;
}
.menu-subtitle { font-size: 18px; color: #b3e5fc; margin-bottom: 50px; font-weight: bold; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.btn-play {
    background: linear-gradient(to bottom, #ffb300, #ff8f00);
    border: 3px solid #fff; border-radius: 50px; padding: 15px 60px;
    font-size: 28px; font-weight: bold; color: #fff; cursor: pointer;
    box-shadow: 0 8px 0 #e65100, 0 15px 20px rgba(0,0,0,0.4);
    transition: all 0.1s; margin-bottom: 20px;
}
.btn-play:active { transform: translateY(6px); box-shadow: 0 2px 0 #e65100, 0 5px 10px rgba(0,0,0,0.4); }

.level-select {
    background: rgba(255,255,255,0.2); color: white; border: 2px solid white;
    padding: 10px 20px; border-radius: 20px; font-size: 18px; font-weight: bold;
    outline: none; cursor: pointer;
}
.level-select option { background: #1e3c72; color: white; }

/* عناصر اللعبة */
#game-container { position: absolute; inset: 0; display: none; }
#game { width: 100%; height: 100%; touch-action: none; }
#ui-layer {
    position: absolute; top: 0; left: 0; right: 0; padding: 10px;
    pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
}
#status {
    background: rgba(0,0,0,0.6); color: #fff; padding: 8px 16px; border-radius: 20px;
    font-size: 16px; font-weight: bold; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
}
.controls { display: flex; gap: 10px; pointer-events: auto; }
.icon-btn {
    background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.3);
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);
}
.icon-btn:active { background: rgba(255,255,255,0.3); }

#promotion {
    display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(30, 60, 114, 0.95); padding: 20px; border-radius: 15px; z-index: 100;
    border: 2px solid #ffb300; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; color: white;
}
.promo-btns { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
.promo-btns button {
    width: 50px; height: 50px; border-radius: 10px; border: none; font-size: 24px;
    background: #ffb300; cursor: pointer; box-shadow: 0 4px 0 #e65100;
}
.promo-btns button:active { transform: translateY(4px); box-shadow: none; }

#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 24px; font-weight: bold; display: none; z-index: 50;
}
</style>
</head>
<body>

<!-- الواجهة الرئيسية -->
<div id="main-menu">
    <div class="menu-title">شطرنج الغابة</div>
    <div class="menu-subtitle">Modern Jungle Chess 3D</div>
    
    <select id="level" class="level-select">
        <option value="easy">🟢 مستوى سهل</option>
        <option value="hard" selected>🔴 مستوى صعب</option>
    </select>
    <br><br>
    <button class="btn-play" onclick="startGame()">ابدأ اللعب</button>
</div>

<!-- حاوية اللعبة -->
<div id="game-container">
    <div id="game"></div>
    <div id="loading">جاري تحضير الغابة...</div>
    
    <div id="ui-layer">
        <div id="status">جاري التحميل...</div>
        <div class="controls">
            <button class="icon-btn" onclick="newGame()" title="لعبة جديدة">🔄</button>
            <button class="icon-btn" onclick="undoMove()" title="تراجع">↩️</button>
        </div>
    </div>

    <div id="promotion">
        <div style="font-size:18px; font-weight:bold; margin-bottom:10px;">ترقية الجندي إلى:</div>
        <div class="promo-btns">
            <button onclick="promote('q')" title="ملكة">♕</button>
            <button onclick="promote('r')" title="رخ">♖</button>
            <button onclick="promote('b')" title="فيل">♗</button>
            <button onclick="promote('n')" title="حصان">♘</button>
        </div>
    </div>
</div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "OrbitControls":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
 "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js"}}
</script>

<script type="module">
import * as T from "three";
import {OrbitControls} from "OrbitControls";
import {Chess} from "chess";

// إعدادات اللعبة
const chess = new Chess();
const files = "abcdefgh";
const $ = id => document.getElementById(id);

// ---- إعدادات المشهد ----
const scene = new T.Scene();
// لون سماء زاهي مع ضباب للعمق
scene.background = new T.Color(0x87CEEB); 
scene.fog = new T.Fog(0x87CEEB, 20, 60);

const camera = new T.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 12, 13); // زاوية ثابتة وجميلة

const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
$("game").appendChild(renderer.domElement);

// التحكم بالكاميرا (ثابتة)
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false; // منع تحريك الرقعة
controls.minDistance = 9;   // أقصى تقريب
controls.maxDistance = 18;  // أقصى تبعيد
controls.minPolarAngle = Math.PI / 4; // منع النظر من الأسفل
controls.maxPolarAngle = Math.PI / 2.2; // منع النظر من الأعلى جداً
controls.update();

// ---- الإضاءة الزاهية ----
const hemiLight = new T.HemisphereLight(0xffffff, 0x444444, 1.5);
scene.add(hemiLight);

const sunLight = new T.DirectionalLight(0xfff5e6, 2.5);
sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -10;
sunLight.shadow.camera.right = 10;
sunLight.shadow.camera.top = 10;
sunLight.shadow.camera.bottom = -10;
scene.add(sunLight);

// ---- تصميم الغابة الواقعية ----
const groundGeo = new T.PlaneGeometry(200, 200);
const groundMat = new T.MeshStandardMaterial({ color: 0x2E8B57, roughness: 1 }); // لون عشبي زاهي
const ground = new T.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.6;
ground.receiveShadow = true;
scene.add(ground);

// دالة إنشاء شجرة
function createTree(x, z, scale = 1) {
    const tree = new T.Group();
    
    // الجذع
    const trunkMat = new T.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.9 });
    const trunk = new T.Mesh(new T.CylinderGeometry(0.3 * scale, 0.5 * scale, 2 * scale, 8), trunkMat);
    trunk.position.y = 1 * scale;
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    tree.add(trunk);
    
    // الأوراق (طبقات متعددة لإعطاء شكل واقعي)
    const leafMat1 = new T.MeshStandardMaterial({ color: 0x228B22, roughness: 0.8 }); // أخضر غامق
    const leafMat2 = new T.MeshStandardMaterial({ color: 0x32CD32, roughness: 0.8 }); // أخضر فاتح زاهي
    
    const leaf1 = new T.Mesh(new T.ConeGeometry(1.5 * scale, 2 * scale, 8), leafMat1);
    leaf1.position.y = 2.5 * scale;
    leaf1.castShadow = true;
    leaf1.receiveShadow = true;
    tree.add(leaf1);
    
    const leaf2 = new T.Mesh(new T.ConeGeometry(1.2 * scale, 1.8 * scale, 8), leafMat2);
    leaf2.position.y = 3.5 * scale;
    leaf2.castShadow = true;
    leaf2.receiveShadow = true;
    tree.add(leaf2);
    
    const leaf3 = new T.Mesh(new T.ConeGeometry(0.8 * scale, 1.5 * scale, 8), leafMat1);
    leaf3.position.y = 4.5 * scale;
    leaf3.castShadow = true;
    leaf3.receiveShadow = true;
    tree.add(leaf3);

    tree.position.set(x, -0.5, z);
    tree.rotation.y = Math.random() * Math.PI * 2;
    scene.add(tree);
}

// توزيع الأشجار حول الرقعة
for (let i = 0; i < 80; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 8 + Math.random() * 25; // توزيع بعيد عن الرقعة
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    createTree(x, z, 0.8 + Math.random() * 0.7);
}

// ---- تصميم الرقعة الثابتة ----
const boardGroup = new T.Group();
scene.add(boardGroup);

// الإطار الخشبي
const borderMat = new T.MeshStandardMaterial({ color: 0x4E342E, roughness: 0.4, metalness: 0.1 });
const border = new T.Mesh(new T.BoxGeometry(9.2, 0.4, 9.2), borderMat);
border.position.y = -0.2;
border.receiveShadow = true;
border.castShadow = true;
boardGroup.add(border);

// المربعات
const lightMat = new T.MeshStandardMaterial({ color: 0xF5DEB3, roughness: 0.3 }); // خشب فاتح
const darkMat = new T.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.3 }); // خشب غامق
const squares = [];

for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
        const isDark = (r + f) % 2 !== 0;
        const mat = isDark ? darkMat : lightMat;
        const square = new T.Mesh(new T.BoxGeometry(1, 0.1, 1), mat);
        square.position.set(f - 3.5, 0, r - 3.5);
        square.receiveShadow = true;
        
        const squareName = files[f] + (8 - r);
        square.userData.square = squareName;
        squares.push(square);
        boardGroup.add(square);
    }
}

// ---- تصميم القطع العصرية ----
const piecesGroup = new T.Group();
scene.add(piecesGroup);

const pieceMaterials = {
    w: new T.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.2, metalness: 0.3 }), // أبيض لؤلؤي
    b: new T.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.5 })  // أسود مطفي
};

function createModernPiece(type, color) {
    const g = new T.Group();
    const mat = pieceMaterials[color];
    
    // دالة مساعدة لإضافة الأشكال
    const addPart = (geo, y, scaleX = 1, scaleY = 1, scaleZ = 1) => {
        const mesh = new T.Mesh(geo, mat);
        mesh.position.y = y;
        mesh.scale.set(scaleX, scaleY, scaleZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        g.add(mesh);
        return mesh;
    };

    // القاعدة المشتركة لكل القطع
    addPart(new T.CylinderGeometry(0.4, 0.45, 0.15, 32), 0.075);
    addPart(new T.CylinderGeometry(0.3, 0.4, 0.1, 32), 0.2);

    switch (type) {
        case "p": // الجندي
            addPart(new T.CylinderGeometry(0.15, 0.25, 0.5, 32), 0.5);
            addPart(new T.SphereGeometry(0.2, 32, 16), 0.85);
            break;
        case "r": // الرخ (القلعة)
            addPart(new T.CylinderGeometry(0.25, 0.3, 0.6, 32), 0.55);
            addPart(new T.CylinderGeometry(0.35, 0.35, 0.15, 32), 0.9);
            // فتحات القلعة
            for (let i = 0; i < 4; i++) {
                const angle = (i * Math.PI) / 2;
                const box = new T.Mesh(new T.BoxGeometry(0.15, 0.15, 0.15), mat);
                box.position.set(Math.cos(angle) * 0.25, 1.0, Math.sin(angle) * 0.25);
                box.castShadow = true;
                g.add(box);
            }
            break;
        case "n": // الحصان (تصميم عصري هندسي)
            addPart(new T.CylinderGeometry(0.15, 0.25, 0.6, 32), 0.5);
            // الرأس
            const head = addPart(new T.BoxGeometry(0.3, 0.4, 0.2), 0.95);
            head.rotation.x = -0.5;
            head.position.z = 0.1;
            // الأذنين
            addPart(new T.ConeGeometry(0.05, 0.15, 8), 1.2, 1, 1, 1).position.z = 0.15;
            break;
        case "b": // الفيل
            addPart(new T.CylinderGeometry(0.15, 0.25, 0.6, 32), 0.5);
            addPart(new T.SphereGeometry(0.25, 32, 16), 0.85);
            addPart(new T.ConeGeometry(0.15, 0.3, 32), 1.15);
            addPart(new T.SphereGeometry(0.05, 16, 16), 1.3);
            break;
        case "q": // الملكة
            addPart(new T.CylinderGeometry(0.15, 0.25, 0.7, 32), 0.6);
            addPart(new T.TorusGeometry(0.2, 0.05, 16, 32), 0.95);
            addPart(new T.SphereGeometry(0.1, 16, 16), 1.1);
            // التاج
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI * 2) / 6;
                const spike = new T.Mesh(new T.ConeGeometry(0.03, 0.15, 8), mat);
                spike.position.set(Math.cos(angle) * 0.2, 1.1, Math.sin(angle) * 0.2);
                spike.castShadow = true;
                g.add(spike);
            }
            break;
        case "k": // الملك
            addPart(new T.CylinderGeometry(0.15, 0.25, 0.8, 32), 0.65);
            addPart(new T.TorusGeometry(0.2, 0.05, 16, 32), 1.05);
            // الصليب
            addPart(new T.BoxGeometry(0.08, 0.3, 0.08), 1.25);
            addPart(new T.BoxGeometry(0.2, 0.08, 0.08), 1.3);
            break;
    }
    
    return g;
}

// دالة تحديد موقع المربع
const getSquarePos = (sq) => {
    const f = files.indexOf(sq[0]);
    const r = 8 - parseInt(sq[1]);
    return { x: f - 3.5, z: r - 3.5 };
};

let selectedSquare = null;
let thinking = false;
let pendingPromotion = null;
const marksGroup = new T.Group();
scene.add(marksGroup);

// رسم القطع
function drawBoard() {
    piecesGroup.clear();
    const board = chess.board();
    
    board.forEach((row, r) => {
        row.forEach((piece, f) => {
            if (!piece) return;
            const squareName = files[f] + (8 - r);
            const pieceMesh = createModernPiece(piece.type, piece.color);
            const pos = getSquarePos(squareName);
            
            pieceMesh.position.set(pos.x, 0.05, pos.z);
            pieceMesh.userData = { square: squareName, color: piece.color };
            piecesGroup.add(pieceMesh);
        });
    });
}

// إبراز المربعات والحركات
function highlightSquares() {
    squares.forEach(sq => {
        const isDark = (parseInt(sq.userData.square[1]) + files.indexOf(sq.userData.square[0])) % 2 === 0;
        sq.material = isDark ? darkMat : lightMat;
    });
    
    marksGroup.clear();
    if (!selectedSquare) return;
    
    // إبراز المربع المحدد
    const selSq = squares.find(s => s.userData.square === selectedSquare);
    if (selSq) selSq.material = new T.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.2 }); // ذهبي

    // إبراز الحركات المتاحة
    const moves = chess.moves({ square: selectedSquare, verbose: true });
    moves.forEach(m => {
        const pos = getSquarePos(m.to);
        const isCapture = m.flags.includes('c') || m.flags.includes('e');
        
        const markMat = new T.MeshStandardMaterial({ 
            color: isCapture ? 0xFF4500 : 0x00FF7F, // برتقالي للأكل، أخضر للحركة
            emissive: isCapture ? 0xFF4500 : 0x00FF7F,
            emissiveIntensity: 0.5,
            transparent: true, opacity: 0.8
        });
        
        const markGeo = isCapture ? new T.TorusGeometry(0.4, 0.05, 16, 32) : new T.CylinderGeometry(0.15, 0.15, 0.02, 16);
        const mark = new T.Mesh(markGeo, markMat);
        mark.position.set(pos.x, 0.06, pos.z);
        if (isCapture) mark.rotation.x = Math.PI / 2;
        marksGroup.add(mark);
    });
}

// حالة اللعبة
function updateStatus() {
    const statusEl = $("status");
    if (chess.isCheckmate()) {
        statusEl.textContent = "🏆 كش مات! " + (chess.turn() === "w" ? "الأسود" : "الأبيض") + " فاز!";
        return true;
    }
    if (chess.isDraw()) {
        statusEl.textContent = "🤝 تعادل!";
        return true;
    }
    if (chess.isCheck()) {
        statusEl.textContent = "⚠️ كش! الملك مهدد";
        return false;
    }
    statusEl.textContent = chess.turn() === "w" ? "دورك (الأبيض)" : "الكمبيوتر يفكر...";
    return false;
}

// ---- الذكاء الاصطناعي ----
const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

function evaluateBoard() {
    let score = 0;
    chess.board().forEach((row, r) => {
        row.forEach((piece, f) => {
            if (!piece) return;
            let val = pieceValues[piece.type];
            if (piece.type === "p") val += (piece.color === "b" ? r : 7 - r) * 4;
            val += (7 - (Math.abs(3.5 - f) + Math.abs(3.5 - r))) * 2;
            score += piece.color === "b" ? val : -val;
        });
    });
    return score;
}

function minimax(depth, alpha, beta, isMax) {
    if (depth === 0 || chess.isGameOver()) return evaluateBoard();
    let best = isMax ? -Infinity : Infinity;
    for (const move of chess.moves()) {
        chess.move(move);
        const val = minimax(depth - 1, alpha, beta, !isMax);
        chess.undo();
        if (isMax) {
            best = Math.max(best, val);
            alpha = Math.max(alpha, best);
        } else {
            best = Math.min(best, val);
            beta = Math.min(beta, best);
        }
        if (beta <= alpha) break;
    }
    return best;
}

function computerMove() {
    if (chess.isGameOver()) return;
    const moves = chess.moves();
    let bestMove = null;

    if ($("level").value === "easy") {
        const captures = moves.filter(m => m.includes("x"));
        const pool = Math.random() < 0.5 && captures.length ? captures : moves;
        bestMove = pool[Math.floor(Math.random() * pool.length)];
    } else {
        let bestVal = -Infinity;
        for (const move of moves) {
            chess.move(move);
            const val = minimax(2, -Infinity, Infinity, false) + Math.random(); // إضافة عشوائية بسيطة
            chess.undo();
            if (val > bestVal) {
                bestVal = val;
                bestMove = move;
            }
        }
    }

    if (bestMove) {
        chess.move(bestMove);
        drawBoard();
        updateStatus();
        thinking = false;
    }
}

// ---- التفاعل (اللمس/الماوس) ----
let touchStart = null;
renderer.domElement.addEventListener("pointerdown", e => touchStart = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
    if (!touchStart || Math.hypot(e.clientX - touchStart[0], e.clientY - touchStart[1]) > 10) return;
    handleTap(e);
});

const raycaster = new T.Raycaster();
const mouse = new T.Vector2();

function handleTap(e) {
    if (thinking || pendingPromotion || chess.isGameOver() || chess.turn() !== "w") return;
    
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    
    raycaster.setFromCamera(mouse, camera);
    
    // البحث عن المربع أو القطعة التي تم النقر عليها
    const intersects = raycaster.intersectObjects([...piecesGroup.children, ...squares], true);
    let clickedSquare = null;
    
    for (const hit of intersects) {
        let obj = hit.object;
        while (obj && !obj.userData.square) obj = obj.parent;
        if (obj) {
            clickedSquare = obj.userData.square;
            break;
        }
    }
    
    if (!clickedSquare) return;
    
    const piece = chess.get(clickedSquare);
    
    // اختيار قطعة بيضاء
    if (piece && piece.color === "w") {
        selectedSquare
