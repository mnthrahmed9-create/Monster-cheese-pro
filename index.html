<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الواجهة الرئيسية - أزرار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: #000;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* الحاوية الرئيسية للصورة */
        #ui-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* 
             ⚠️ هنا تم وضع اسم صورتك بالضبط مع تعديل المسافة إلى %20 
             الصورة اللي أنت رافعها اسمها: menu.jpg (2).png
            */
            background-image: url('menu.jpg%20(2).png');
            
            background-size: 100% 100%; /* تمدد الصورة لتملأ الشاشة بالكامل */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* تنسيق الأزرار الشفافة */
        .hotspot {
            position: absolute;
            background: rgba(255, 0, 0, 0.1); /* لون أحمر شفاف جداً للاختبار */
            border: 2px dashed red; /* حدود حمراء للاختبار */
            cursor: pointer;
            border-radius: 10px;
            z-index: 10;
        }

        /* تأثير عند الضغط على الزر */
        .hotspot:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- إحداثيات الأزرار (تم ضبطها بناءً على الصورة) --- */
        
        /* الشريط العلوي */
        .btn-profile { top: 2%; left: 2%; width: 33%; height: 7%; }
        .btn-gold { top: 2%; left: 49%; width: 6%; height: 4%; }
        .btn-gem { top: 2%; left: 68%; width: 6%; height: 4%; }
        .btn-settings { top: 2%; left: 82%; width: 8%; height: 5%; }
        .btn-mail { top: 2%; right: 2%; width: 8%; height: 5%; }

        /* القائمة اليسرى */
        .btn-quests { top: 33%; left: 3%; width: 18%; height: 6%; }
        .btn-achievements { top: 41%; left: 3%; width: 18%; height: 6%; }
        .btn-rewards { top: 49%; left: 3%; width: 18%; height: 6%; }
        .btn-ranks { top: 57%; left: 3%; width: 18%; height: 6%; }

        /* صندوق المكافآت (يمين) */
        .btn-daily-chest { top: 32%; right: 3%; width: 30%; height: 27%; }

        /* الزر الكبير (ابدأ المواجهة) */
        .btn-start { bottom: 27%; left: 21%; width: 58%; height: 8%; }

        /* الأزرار الثلاثة اللي تحت */
        .btn-online { bottom: 13%; left: 3%; width: 30%; height: 8%; }
        .btn-ai { bottom: 13%; left: 35%; width: 30%; height: 8%; }
        .btn-challenges { bottom: 13%; right: 3%; width: 30%; height: 8%; }

        /* شريط التنقل السفلي */
        .nav-store { bottom: 0; left: 0; width: 25%; height: 10%; }
        .nav-inventory { bottom: 0; left: 25%; width: 25%; height: 10%; }
        .nav-account { bottom: 0; left: 50%; width: 25%; height: 10%; }
        .nav-home { bottom: 0; left: 75%; width: 25%; height: 10%; }

    </style>
</head>
<body>

    <div id="ui-container">
        
        <!-- أزرار الشريط العلوي -->
        <div class="hotspot btn-profile" onclick="alert('الملف الشخصي')"></div>
        <div class="hotspot btn-gold" onclick="alert('شراء ذهب')"></div>
        <div class="hotspot btn-gem" onclick="alert('شراء جواهر')"></div>
        <div class="hotspot btn-settings" onclick="alert('الإعدادات')"></div>
        <div class="hotspot btn-mail" onclick="alert('الرسائل')"></div>

        <!-- أزرار القائمة اليسرى -->
        <div class="hotspot btn-quests" onclick="alert('المهام اليومية')"></div>
        <div class="hotspot btn-achievements" onclick="alert('الإنجازات')"></div>
        <div class="hotspot btn-rewards" onclick="alert('مكافآت خاصة')"></div>
        <div class="hotspot btn-ranks" onclick="alert('رتب والألقاب')"></div>

        <!-- صندوق المكافآت -->
        <div class="hotspot btn-daily-chest" onclick="alert('صندوق المكافآت اليومية')"></div>

        <!-- الزر الرئيسي الكبير -->
        <div class="hotspot btn-start" onclick="alert('ابدأ المواجهة')"></div>

        <!-- الأزرار السفلية -->
        <div class="hotspot btn-online" onclick="alert('اللعب أونلاين')"></div>
        <div class="hotspot btn-ai" onclick="alert('اللعب ضد الكمبيوتر')"></div>
        <div class="hotspot btn-challenges" onclick="alert('التحديات الكبرى')"></div>

        <!-- شريط التنقل السفلي -->
        <div class="hotspot nav-store" onclick="alert('المتجر')"></div>
        <div class="hotspot nav-inventory" onclick="alert('المخزون')"></div>
        <div class="hotspot nav-account" onclick="alert('حسابي')"></div>
        <div class="hotspot nav-home" onclick="alert('الرئيسية')"></div>

    </div>

</body>
</html>
