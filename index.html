<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الواجهة الرئيسية - شطرنج الوحوش 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* لمنع وميض الشاشة عند اللمس */
        }

        body {
            background-color: #000;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* الحاوية الرئيسية للصورة */
        #ui-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* ⚠️ اسم الصورة هنا: تأكد أن الصورة المرفوعة اسمها menu.jpg */
            background-image: url('menu.jpg'); 
            
            background-size: 100% 100%; /* تمدد الصورة لتملأ الشاشة */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================================
           الأزرار الشفافة (بدون خطوط حمراء)
           ========================================= */
        .hotspot {
            position: absolute;
            background: transparent; /* شفافة 100% */
            border: none;
            cursor: pointer;
            border-radius: 10px;
            z-index: 10;
            transition: background 0.1s;
        }

        /* تأثير وميض خفيف عند الضغط ليعرف المستخدم أنه ضغط */
        .hotspot:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- إحداثيات الأزرار المضبوطة --- */
        
        /* الشريط العلوي */
        .btn-profile { top: 1.5%; left: 2%; width: 32%; height: 7.5%; } /* الملف الشخصي */
        .btn-gold-plus { top: 1.5%; left: 54.5%; width: 5%; height: 3.5%; border-radius: 50%; } /* زر + الذهب */
        .btn-gem-plus { top: 1.5%; left: 76%; width: 5%; height: 3.5%; border-radius: 50%; } /* زر + الجواهر */
        .btn-settings { top: 1.5%; left: 84.5%; width: 6%; height: 4%; border-radius: 50%; } /* الإعدادات */
        .btn-mail { top: 1.5%; right: 2.5%; width: 7.5%; height: 4%; border-radius: 10px; } /* الرسائل */

        /* القائمة اليسرى */
        .btn-quests { top: 33.5%; left: 2%; width: 18%; height: 6%; } /* المهام اليومية */
        .btn-achievements { top: 41%; left: 2%; width: 18%; height: 6%; } /* الإنجازات */
        .btn-rewards { top: 48.5%; left: 2%; width: 18%; height: 6%; } /* مكافآت خاصة */
        .btn-ranks { top: 56.5%; left: 2%; width: 18%; height: 6%; } /* رتب والألقاب */

        /* صندوق المكافآت اليومية (اليمين) */
        .btn-daily-chest { top: 33.5%; right: 2%; width: 28%; height: 19.5%; } /* صندوق المكافآت */
        .btn-streak { top: 54%; right: 2%; width: 28%; height: 5%; } /* تاجات الأيام 1, 2, 3 */

        /* الزر الرئيسي الكبير (ابدأ المواجهة) */
        .btn-start { bottom: 28.5%; left: 22%; width: 56%; height: 7.5%; } 

        /* الأزرار الثلاثة السفلية */
        .btn-online { bottom: 12.5%; left: 2.5%; width: 29%; height: 8.5%; } /* اللعب أونلاين */
        .btn-ai { bottom: 12.5%; left: 35.5%; width: 29%; height: 8.5%; } /* اللعب ضد الكمبيوتر */
        .btn-challenges { bottom: 12.5%; right: 2.5%; width: 29%; height: 8.5%; } /* التحديات الكبرى */

        /* شريط التنقل السفلي */
        .nav-store { bottom: 0; left: 0; width: 25%; height: 9.5%; } /* المتجر */
        .nav-inventory { bottom: 0; left: 25%; width: 25%; height: 9.5%; } /* المخزون */
        .nav-account { bottom: 0; left: 50%; width: 25%; height: 9.5%; } /* حسابي */
        .nav-home { bottom: 0; left: 75%; width: 25%; height: 9.5%; } /* الرئيسية */

    </style>
</head>
<body>

    <div id="ui-container">
        
        <!-- الشريط العلوي -->
        <div class="hotspot btn-profile" onclick="alert('الملف الشخصي')"></div>
        <div class="hotspot btn-gold-plus" onclick="alert('شراء ذهب')"></div>
        <div class="hotspot btn-gem-plus" onclick="alert('شراء جواهر')"></div>
        <div class="hotspot btn-settings" onclick="alert('الإعدادات')"></div>
        <div class="hotspot btn-mail" onclick="alert('الرسائل')"></div>

        <!-- القائمة اليسرى -->
        <div class="hotspot btn-quests" onclick="alert('المهام اليومية')"></div>
        <div class="hotspot btn-achievements" onclick="alert('الإنجازات')"></div>
        <div class="hotspot btn-rewards" onclick="alert('مكافآت خاصة')"></div>
        <div class="hotspot btn-ranks" onclick="alert('رتب والألقاب')"></div>

        <!-- صندوق المكافآت -->
        <div class="hotspot btn-daily-chest" onclick="alert('افتح صندوق المكافآت!')"></div>
        <div class="hotspot btn-streak" onclick="alert('سلسلة المكافآت')"></div>

        <!-- 🟢 الأزرار اللي تنقل للعبة (مربوطة بملف game.html) -->
        <div class="hotspot btn-start" onclick="window.location.href='game.html'"></div>
        <div class="hotspot btn-ai" onclick="window.location.href='game.html'"></div>

        <!-- الأزرار السفلية الباقية -->
        <div class="hotspot btn-online" onclick="alert('اللعب أونلاين (قريباً)')"></div>
        <div class="hotspot btn-challenges" onclick="alert('التحديات الكبرى (قريباً)')"></div>

        <!-- شريط التنقل السفلي -->
        <div class="hotspot nav-store" onclick="alert('المتجر')"></div>
        <div class="hotspot nav-inventory" onclick="alert('المخزون')"></div>
        <div class="hotspot nav-account" onclick="alert('حسابي')"></div>
        <div class="hotspot nav-home" onclick="alert('أنت في الرئيسية')"></div>

    </div>

</body>
</html>
