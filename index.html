<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شطرنج الوحوش 3D - الأزرار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* لمنع وميض الشاشة عند اللمس */
        }

        body {
            background-color: #000;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        #ui-container {
            position: relative;
            width: 100%;
            height: 100%;
            
            /* ⚠️ غير هذا الاسم إلى اسم صورتك بالضبط إذا كان مختلفاً */
            background-image: url('bg.png'); 
            
            background-size: 100% 100%; /* تمدد الصورة لتملأ الشاشة تماماً */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================================
           الأزرار الشفافة (بدون خطوط حمراء)
           ========================================= */
        .hotspot {
            position: absolute;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            z-index: 10;
            transition: background 0.1s;
        }

        /* تأثير وميض خفيف جداً عند الضغط ليعرف المستخدم أنه ضغط على الزر */
        .hotspot:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* =========================================
           إحداثيات الأزرار (تم ضبطها بدقة على الصورة الجديدة)
           ========================================= */
        
        /* --- الشريط العلوي --- */
        .btn-profile { top: 1.5%; left: 2%; width: 32%; height: 7.5%; } /* الملف الشخصي */
        .btn-gold-plus { top: 1.5%; left: 55%; width: 5%; height: 3.5%; border-radius: 50%; } /* زر + الذهب */
        .btn-gem-plus { top: 1.5%; left: 76%; width: 5%; height: 3.5%; border-radius: 50%; } /* زر + الجواهر */
        .btn-settings { top: 1.5%; left: 84%; width: 6.5%; height: 4%; border-radius: 50%; } /* الإعدادات */
        .btn-mail { top: 1.5%; right: 2%; width: 7.5%; height: 4%; border-radius: 10px; } /* الرسائل */

        /* --- القائمة اليسرى --- */
        .btn-quests { top: 33%; left: 2%; width: 18%; height: 6.5%; } /* المهام اليومية */
        .btn-achievements { top: 41%; left: 2%; width: 18%; height: 6.5%; } /* الإنجازات */
        .btn-rewards { top: 49%; left: 2%; width: 18%; height: 6.5%; } /* مكافآت خاصة */
        .btn-ranks { top: 57%; left: 2%; width: 18%; height: 6.5%; } /* رتب والألقاب */

        /* --- صندوق المكافآت اليومية (اليمين) --- */
        .btn-daily-chest { top: 33%; right: 2%; width: 28%; height: 20%; } /* صندوق المكافآت الكبير */
        .btn-streak { top: 54%; right: 2%; width: 28%; height: 5%; } /* تاجات الأيام 1, 2, 3 */

        /* --- الزر الرئيسي الكبير --- */
        .btn-start { bottom: 28.5%; left: 22%; width: 56%; height: 7.5%; } /* ابدأ المواجهة */

        /* --- الأزرار الثلاثة السفلية --- */
        .btn-online { bottom: 12%; left: 3%; width: 29%; height: 9%; } /* اللعب أونلاين */
        .btn-ai { bottom: 12%; left: 35.5%; width: 29%; height: 9%; } /* اللعب ضد الكمبيوتر */
        .btn-challenges { bottom: 12%; right: 3%; width: 29%; height: 9%; } /* التحديات الكبرى */

        /* --- شريط التنقل السفلي --- */
        .nav-store { bottom: 0; left: 0; width: 25%; height: 9%; } /* المتجر */
        .nav-inventory { bottom: 0; left: 25%; width: 25%; height: 9%; } /* المخزون */
        .nav-account { bottom: 0; left: 50%; width: 25%; height: 9%; } /* حسابي */
        .nav-home { bottom: 0; left: 75%; width: 25%; height: 9%; } /* الرئيسية */

    </style>
</head>
<body>

    <div id="ui-container">
        
        <!-- الشريط العلوي -->
        <div class="hotspot btn-profile" onclick="alert('الملف الشخصي')"></div>
        <div class="hotspot btn-gold-plus" onclick="alert('شراء ذهب')"></div>
        <div class="hotspot btn-gem-plus" onclick="alert('شراء جواهر')"></div>
        <div class="hotspot btn-settings" onclick="alert('الإعدادات')"></div>
        <div class="hotspot btn-mail" onclick="alert('الرسائل')"></div>

        <!-- القائمة اليسرى -->
        <div class="hotspot btn-quests" onclick="alert('المهام اليومية')"></div>
        <div class="hotspot btn-achievements" onclick="alert('الإنجازات')"></div>
        <div class="hotspot btn-rewards" onclick="alert('مكافآت خاصة')"></div>
        <div class="hotspot btn-ranks" onclick="alert('رتب والألقاب')"></div>

        <!-- صندوق المكافآت -->
        <div class="hotspot btn-daily-chest" onclick="alert('افتح صندوق المكافآت!')"></div>
        <div class="hotspot btn-streak" onclick="alert('سلسلة المكافآت')"></div>

        <!-- الزر الرئيسي الكبير -->
        <!-- ⚠️ ملاحظة: لتشغيل اللعبة، غير alert إلى game.html -->
        <div class="hotspot btn-start" onclick="alert('ابدأ المواجهة')"></div>

        <!-- الأزرار السفلية -->
        <div class="hotspot btn-online" onclick="alert('اللعب أونلاين')"></div>
        <div class="hotspot btn-ai" onclick="alert('اللعب ضد الكمبيوتر')"></div>
        <div class="hotspot btn-challenges" onclick="alert('التحديات الكبرى')"></div>

        <!-- شريط التنقل السفلي -->
        <div class="hotspot nav-store" onclick="alert('المتجر')"></div>
        <div class="hotspot nav-inventory" onclick="alert('المخزون')"></div>
        <div class="hotspot nav-account" onclick="alert('حسابي')"></div>
        <div class="hotspot nav-home" onclick="alert('أنت في الرئيسية')"></div>

    </div>

</body>
</html>
