
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monster Chess 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#main-menu{
 position:fixed;inset:0;z-index:1000;
 background:radial-gradient(circle at top,#477c9e,#102b46 65%,#071522);
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;color:white;
}
.menu-title{
 font-size:42px;font-weight:900;color:#ffd54f;
 text-shadow:0 4px 0 #9b4b00,0 8px 20px #000;
 margin-bottom:12px;
}
.menu-subtitle{font-size:17px;color:#b9e8ff;margin-bottom:35px}
.level-select{
 background:#183e59;color:white;border:2px solid #ffd54f;
 padding:13px 25px;border-radius:20px;font-size:18px;
}
.btn-play{
 margin-top:35px;padding:16px 65px;
 border:3px solid white;border-radius:50px;
 background:linear-gradient(#ffca28,#ff8f00);
 color:#fff;font-size:25px;font-weight:bold;
 box-shadow:0 7px 0 #a84b00;
}
.btn-play:active{transform:translateY(5px);box-shadow:none}

#game-container{position:fixed;inset:0;display:none}
#game{position:absolute;inset:0}
#game canvas{display:block;width:100%;height:100%;touch-action:none}

#ui-layer{
 position:absolute;top:0;left:0;right:0;
 padding:12px;display:flex;justify-content:space-between;
 align-items:center;pointer-events:none;
}
#status{
 background:#101d2cdd;color:white;
 border:1px solid #ffd54f;border-radius:20px;
 padding:10px 15px;font-size:14px;font-weight:bold;
}
.controls{display:flex;gap:8px;pointer-events:auto}
.icon-btn{
 width:43px;height:43px;border-radius:50%;
 border:1px solid #ffffff77;background:#142b42dd;
 color:white;font-size:20px;
}
#promotion{
 display:none;position:absolute;z-index:100;
 top:50%;left:50%;transform:translate(-50%,-50%);
 background:#132d48f5;color:white;
 border:2px solid #ffd54f;border-radius:18px;
 padding:20px;width:90%;max-width:330px;
}
#promotion h3{margin-bottom:15px}
.promo-btns{display:flex;justify-content:center;gap:9px}
.promo-btns button{
 width:52px;height:52px;border:0;border-radius:10px;
 background:#ffbf27;color:#222;font-size:28px;
}
#loading{
 display:none;position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);color:white;
 font-size:20px;z-index:50;
}
</style>
</head>

<body>

<div id="main-menu">
 <div class="menu-title">🐉 شطرنج الوحوش</div>
 <div class="menu-subtitle">MONSTER CHESS 3D</div>

 <select id="level" class="level-select">
  <option value="easy">🟢 مستوى سهل</option>
  <option value="hard" selected>🔴 مستوى صعب</option>
 </select>

 <button class="btn-play" onclick="startGame()">ابدأ اللعب</button>
</div>

<div id="game-container">
 <div id="game"></div>
 <div id="loading">جاري تحضير الغابة...</div>

 <div id="ui-layer">
  <div id="status">جاهز</div>
  <div class="controls">
   <button class="icon-btn" onclick="newGame()">🔄</button>
   <button class="icon-btn" onclick="undoMove()">↩️</button>
   <button class="icon-btn" onclick="goMenu()">🏠</button>
  </div>
 </div>

 <div id="promotion">
  <h3>اختر ترقية الجندي</h3>
  <div class="promo-btns">
   <button onclick="promote('q')">♕</button>
   <button onclick="promote('r')">♖</button>
   <button onclick="promote('b')">♗</button>
   <button onclick="promote('n')">♘</button>
  </div>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "OrbitControls":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js"
 }
}
</script>

<script type="module">
import * as T from "three";
import {OrbitControls} from "OrbitControls";
import {Chess} from "chess";

const $=id=>document.getElementById(id);
const chess=new Chess();
const files="abcdefgh";

let selectedSquare=null;
let thinking=false;
let pendingPromotion=null;
let gameStarted=false;

const scene=new T.Scene();
scene.background=new T.Color(0x87CEEB);
scene.fog=new T.Fog(0x87CEEB,20,55);

const camera=new T.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,12,13);

const renderer=new T.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

$("game").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.enablePan=false;
controls.minDistance=9;
controls.maxDistance=18;
controls.minPolarAngle=Math.PI/4;
controls.maxPolarAngle=Math.PI/2.2;
controls.update();

scene.add(new T.HemisphereLight(0xffffff,0x456044,1.8));

const sun=new T.DirectionalLight(0xfff0d0,2.5);
sun.position.set(10,20,10);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12;
sun.shadow.camera.right=12;
sun.shadow.camera.top=12;
sun.shadow.camera.bottom=-12;
scene.add(sun);

// الأرضية
const ground=new T.Mesh(
 new T.PlaneGeometry(200,200),
 new T.MeshStandardMaterial({color:0x267b43,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.6;
ground.receiveShadow=true;
scene.add(ground);

// الأشجار
function createTree(x,z,s=1){
 const tree=new T.Group();

 const trunk=new T.Mesh(
  new T.CylinderGeometry(.3*s,.45*s,2*s,8),
  new T.MeshStandardMaterial({color:0x70452b})
 );
 trunk.position.y=s;
 trunk.castShadow=true;
 tree.add(trunk);

 const colors=[0x176b29,0x29a344,0x55bb39];

 for(let i=0;i<3;i++){
  const leaves=new T.Mesh(
   new T.ConeGeometry((1.5-i*.3)*s,(2-i*.15)*s,8),
   new T.MeshStandardMaterial({color:colors[i]})
  );
  leaves.position.y=(2.5+i*1.1)*s;
  leaves.castShadow=true;
  tree.add(leaves);
 }

 tree.position.set(x,-.5,z);
 tree.rotation.y=Math.random()*6;
 scene.add(tree);
}

for(let i=0;i<40;i++){
 const a=Math.random()*Math.PI*2;
 const r=9+Math.random()*19;
 createTree(Math.cos(a)*r,Math.sin(a)*r,.7+Math.random()*.6);
}

// الرقعة
const boardGroup=new T.Group();
scene.add(boardGroup);

const border=new T.Mesh(
 new T.BoxGeometry(9.2,.4,9.2),
 new T.MeshStandardMaterial({color:0x573725,roughness:.4})
);
border.position.y=-.2;
border.receiveShadow=true;
border.castShadow=true;
boardGroup.add(border);

const lightMat=new T.MeshStandardMaterial({
 color:0xe9d3a2,roughness:.4
});
const darkMat=new T.MeshStandardMaterial({
 color:0x563b2c,roughness:.4
});

const squares=[];

for(let r=0;r<8;r++){
 for(let f=0;f<8;f++){
  const square=new T.Mesh(
   new T.BoxGeometry(1,.1,1),
   (r+f)%2?darkMat:lightMat
  );
  square.position.set(f-3.5,0,r-3.5);
  square.receiveShadow=true;
  square.userData.square=files[f]+(8-r);
  squares.push(square);
  boardGroup.add(square);
 }
}

// المواد
const pieceMaterials={
 w:new T.MeshStandardMaterial({
  color:0xffe7a0,metalness:.45,roughness:.22
 }),
 b:new T.MeshStandardMaterial({
  color:0x29233c,metalness:.6,roughness:.24
 })
};

const goldMat=new T.MeshStandardMaterial({
 color:0xffc52c,metalness:.7,roughness:.2
});
const redMat=new T.MeshStandardMaterial({
 color:0xa51e2d,metalness:.5,roughness:.3
});

const piecesGroup=new T.Group();
scene.add(piecesGroup);

const marksGroup=new T.Group();
scene.add(marksGroup);

// تصميم القطع
function createModernPiece(type,color){

 const g=new T.Group();
 const mat=pieceMaterials[color];

 function part(geo,y,sx=1,sy=1,sz=1,material=mat){
  const m=new T.Mesh(geo,material);
  m.position.y=y;
  m.scale.set(sx,sy,sz);
  m.castShadow=true;
  m.receiveShadow=true;
  g.add(m);
  return m;
 }

 // قاعدة
 part(new T.CylinderGeometry(.4,.46,.15,32),.075);
 part(new T.CylinderGeometry(.3,.4,.1,32),.2,1,1,1,goldMat);

 switch(type){

 case "p":
  // الجندي الوحش
  part(new T.CylinderGeometry(.14,.25,.5,24),.5);
  part(new T.SphereGeometry(.2,24,16),.85);
  part(new T.ConeGeometry(.07,.22,8),1.08,1,1,1,goldMat);
  break;

 case "r":
  // القلعة
  part(new T.CylinderGeometry(.25,.32,.65,24),.55);
  part(new T.CylinderGeometry(.37,.37,.18,24),.95);
  for(let i=0;i<4;i++){
   const a=i*Math.PI/2;
   const m=part(new T.BoxGeometry(.15,.18,.15),1.1);
   m.position.x=Math.cos(a)*.25;
   m.position.z=Math.sin(a)*.25;
  }
  break;

 case "n":
  // الحصان الوحش
  part(new T.CylinderGeometry(.16,.28,.55,24),.5);
  const head=part(new T.BoxGeometry(.32,.43,.24),.95);
  head.rotation.x=-.4;
  head.position.z=.12;
  part(new T.ConeGeometry(.07,.25,8),1.23);
  part(new T.ConeGeometry(.07,.25,8),1.23).position.x=.18;
  part(new T.SphereGeometry(.06,12,12),.95,1,1,1,redMat).position.z=.25;
  break;

 case "b":
  // الساحر
  part(new T.CylinderGeometry(.16,.27,.6,24),.5);
  part(new T.SphereGeometry(.22,24,16),.85);
  part(new T.ConeGeometry(.24,.5,24),1.2,1,1,1,goldMat);
  part(new T.SphereGeometry(.08,16,12),1.5,1,1,1,redMat);
  break;

 case "q":
  // الملكة
  part(new T.CylinderGeometry(.16,.28,.7,24),.6);
  part(new T.TorusGeometry(.23,.06,12,32),1);
  part(new T.SphereGeometry(.14,20,16),1.15);
  for(let i=0;i<6;i++){
   const a=i*Math.PI/3;
   const m=part(new T.ConeGeometry(.055,.22,8),1.27);
   m.position.x=Math.cos(a)*.22;
   m.position.z=Math.sin(a)*.22;
  }
  part(new T.SphereGeometry(.09,16,12),1.42,1,1,1,goldMat);
  break;

 case "k":
  // الملك
  part(new T.CylinderGeometry(.16,.28,.8,24),.65);
  part(new T.TorusGeometry(.23,.06,12,32),1.1);
  part(new T.BoxGeometry(.09,.4,.09),1.38,1,1,1,goldMat);
  part(new T.BoxGeometry(.27,.09,.09),1.43,1,1,1,goldMat);
  part(new T.SphereGeometry(.1,16,12),1.65,1,1,1,redMat);
  break;
 }

 return g;
}

function getSquarePos(sq){
 const f=files.indexOf(sq[0]);
 const r=8-Number(sq[1]);
 return {x:f-3.5,z:r-3.5};
}

// رسم الرقعة والقطع
function drawBoard(){
 piecesGroup.clear();

 const board=chess.board();

 board.forEach((row,r)=>{
  row.forEach((piece,f)=>{
   if(!piece)return;

   const sq=files[f]+(8-r);
   const mesh=createModernPiece(piece.type,piece.color);
   const pos=getSquarePos(sq);

   mesh.position.set(pos.x,.06,pos.z);
   mesh.userData={square:sq,color:piece.color};

   piecesGroup.add(mesh);
  });
 });

 highlightSquares();
 updateStatus();
}

function highlightSquares(){

 squares.forEach(sq=>{
  const name=sq.userData.square;
  const f=files.indexOf(name[0]);
  const r=8-Number(name[1]);
  sq.material=(r+f)%2?darkMat:lightMat;
 });

 marksGroup.clear();

 if(!selectedSquare)return;

 const selected=squares.find(
  s=>s.userData.square===selectedSquare
 );

 if(selected){
  selected.material=new T.MeshStandardMaterial({
   color:0xffd700,emissive:0x664400
  });
 }

 const moves=chess.moves({
  square:selectedSquare,
  verbose:true
 });

 moves.forEach(m=>{
  const pos=getSquarePos(m.to);
  const capture=m.flags.includes("c")||m.flags.includes("e");

  const material=new T.MeshStandardMaterial({
   color:capture?0xff3b22:0x00ff88,
   emissive:capture?0xff2200:0x00aa55,
   emissiveIntensity:.6,
   transparent:true,
   opacity:.8
  });

  const mark=new T.Mesh(
   capture?
   new T.TorusGeometry(.38,.06,12,24):
   new T.CylinderGeometry(.16,.16,.025,20),
   material
  );

  mark.position.set(pos.x,.08,pos.z);
  if(capture)mark.rotation.x=Math.PI/2;
  marksGroup.add(mark);
 });
}

// حالة اللعبة
function updateStatus(){

 const el=$("status");

 if(chess.isCheckmate()){
  el.textContent="🏆 كش مات! "+(
   chess.turn()==="w"?"الأسود فاز":"الأبيض فاز"
  );
  return true;
 }

 if(chess.isStalemate()||chess.isDraw()){
  el.textContent="🤝 انتهت اللعبة بالتعادل";
  return true;
 }

 if(chess.isCheck()){
  el.textContent="⚠️ كش! الملك مهدد";
  return false;
 }

 el.textContent=chess.turn()==="w"?
 "⚪ دورك - الأبيض":"⚫ الكمبيوتر يفكر...";
 return false;
}

// الذكاء الاصطناعي
const values={
 p:100,n:320,b:330,r:500,q:900,k:20000
};

function evaluateBoard(){

 if(chess.isCheckmate()){
  return chess.turn()==="w"?100000:-100000;
 }

 if(chess.isDraw())return 0;

 let score=0;
 const board=chess.board();

 board.forEach((row,r)=>{
  row.forEach((piece,f)=>{
   if(!piece)return;

   let val=values[piece.type];

   if(piece.type==="p"){
    val+=(piece.color==="b"?r:7-r)*4;
   }

   val+=(7-(Math.abs(3.5-f)+Math.abs(3.5-r)))*2;

   score+=piece.color==="b"?val:-val;
  });
 });

 return score;
}

function minimax(depth,alpha,beta){

 if(depth===0||chess.isGameOver()){
  return evaluateBoard();
 }

 const maximizing=chess.turn()==="b";
 let best=maximizing?-Infinity:Infinity;

 const moves=chess.moves();

 for(const move of moves){
  chess.move(move);

  const val=minimax(depth-1,alpha,beta);

  chess.undo();

  if(maximizing){
   best=Math.max(best,val);
   alpha=Math.max(alpha,best);
  }else{
   best=Math.min(best,val);
   beta=Math.min(beta,best);
  }

  if(beta<=alpha)break;
 }

 return best;
}

function computerMove(){

 if(chess.isGameOver()||chess.turn()!=="b"){
  thinking=false;
  return;
 }

 const moves=chess.moves();
 let bestMove=null;

 if($("level").value==="easy"){

  const captures=moves.filter(m=>m.includes("x"));
  const pool=Math.random()<.5&&captures.length?captures:moves;

  bestMove=pool[Math.floor(Math.random()*pool.length)];

 }else{

  let bestVal=-Infinity;

  for(const move of moves){

   chess.move(move);

   const val=minimax(2,-Infinity,Infinity)+Math.random()*.01;

   chess.undo();

   if(val>bestVal){
    bestVal=val;
    bestMove=move;
   }
  }
 }

 if(bestMove){
  chess.move(bestMove);
 }

 thinking=false;
 drawBoard();
}

// تنفيذ حركة اللاعب
function afterPlayerMove(){

 selectedSquare=null;
 pendingPromotion=null;
 $("promotion").style.display="none";

 drawBoard();

 if(!chess.isGameOver()){
  thinking=true;
  $("status").textContent="🤖 الكمبيوتر يفكر...";
  setTimeout(computerMove,350);
 }
}

// ترقية الجندي
window.promote=function(type){

 if(!pendingPromotion)return;

 const move={
  from:pendingPromotion.from,
  to:pendingPromotion.to,
  promotion:type
 };

 try{
  chess.move(move);
  afterPlayerMove();
 }catch(e){
  pendingPromotion=null;
  $("promotion").style.display="none";
 }
};

// اللمس والنقر
const raycaster=new T.Raycaster();
const mouse=new T.Vector2();
let touchStart=null;

renderer.domElement.addEventListener("pointerdown",e=>{
 touchStart={x:e.clientX,y:e.clientY};
});

renderer.domElement.addEventListener("pointerup",e=>{

 if(!touchStart)return;

 const moved=Math.hypot(
  e.clientX-touchStart.x,
  e.clientY-touchStart.y
 );

 touchStart=null;

 if(moved>12)return;

 handleTap(e);
});

function handleTap(e){

 if(thinking||pendingPromotion||chess.isGameOver())return;
 if(chess.turn()!=="w")return;

 const rect=renderer.domElement.getBoundingClientRect();

 mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(mouse,camera);

 const objects=[
  ...piecesGroup.children,
  ...squares
 ];

 const hits=raycaster.intersectObjects(objects,true);

 let clickedSquare=null;

 for(const hit of hits){
  let obj=hit.object;

  while(obj&&!obj.userData.square){
   obj=obj.parent;
  }

  if(obj&&obj.userData.square){
   clickedSquare=obj.userData.square;
   break;
  }
 }

 if(!clickedSquare)return;

 const piece=chess.get(clickedSquare);

 // اختيار قطعة اللاعب
 if(!selectedSquare){

  if(piece&&piece.color==="w"){
   selectedSquare=clickedSquare;
   highlightSquares();
  }

  return;
 }

 // اختيار قطعة أخرى
 if(piece&&piece.color==="w"){
  selectedSquare=clickedSquare;
  highlightSquares();
  return;
 }

 // التحقق من الحركة
 const moves=chess.moves({
  square:selectedSquare,
  verbose:true
 });

 const target=moves.find(m=>m.to===clickedSquare);

 if(target){

  if(target.promotion){
   pendingPromotion={
    from:selectedSquare,
    to:clickedSquare
   };
   $("promotion").style.display="block";
   return;
  }

  try{
   chess.move({
    from:selectedSquare,
    to:clickedSquare
   });

   afterPlayerMove();

  }catch(err){
   selectedSquare=null;
   drawBoard();
  }

 }else{
  selectedSquare=null;
  highlightSquares();
 }
}

// لعبة جديدة
window.newGame=function(){

 chess.reset();
 selectedSquare=null;
 pendingPromotion=null;
 thinking=false;

 $("promotion").style.display="none";

 drawBoard();
};

// تراجع
window.undoMove=function(){

 if(thinking)return;

 if(chess.history().length===0)return;

 chess.undo();

 // التراجع عن حركة الكمبيوتر وحركة اللاعب
 if(chess.history().length>0&&chess.turn()==="w"){
  chess.undo();
 }

 selectedSquare=null;
 pendingPromotion=null;
 thinking=false;

 $("promotion").style.display="none";
 drawBoard();
};

// بدء اللعبة
window.startGame=function(){

 $("main-menu").style.display="none";
 $("game-container").style.display="block";
 $("loading").style.display="block";

 gameStarted=true;

 setTimeout(()=>{
  resize();
  newGame();
  $("loading").style.display="none";
 },150);
};

// الرجوع للقائمة
window.goMenu=function(){

 thinking=false;
 selectedSquare=null;
 pendingPromotion=null;

 $("promotion").style.display="none";
 $("game-container").style.display="none";
 $("main-menu").style.display="flex";
};

// حجم الشاشة
function resize(){

 const w=$("game").clientWidth;
 const h=$("game").clientHeight;

 if(!w||!h)return;

 camera.aspect=w/h;
 camera.updateProjectionMatrix();

 renderer.setSize(w,h,false);
}

window.addEventListener("resize",resize);

// حلقة العرض
function animate(){

 requestAnimationFrame(animate);

 controls.update();

 renderer.render(scene,camera);
}

resize();
animate();

</script>
</body>
</html>
